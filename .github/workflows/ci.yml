name: PHP checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, pdo_mysql
      - run: find photo_game tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/bootstrap.php
